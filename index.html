<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Loja de roupas</title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
    <header>
        <h1>Minha Loja</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Carrinho</a>
        </nav>
    </header>

  <main>

    <section class="banner">

        <div class="banner-conteudo">
            <h2>Nova Coleção</h2>
            <p>Encontre roupas para o seu estilo.</p>
            <button>Ver produtos</button>
        </div>

    </section>


    <section class="produtos">

        <h2>Produtos em Destaque</h2>

        <div class="grade-produtos">

            <div class="card-produto">
                <img src="img/camiseta.jpg" alt="Camiseta preta">

                <h3>Camiseta Preta</h3>

                <p>R$ 79,90</p>

                <button>Adicionar ao Carrinho</button>
            </div>


            <div class="card-produto">
                <img src="img/calca.jpg" alt="Calça Jeans">

                <h3>Calça Jeans</h3>

                <p>R$ 129,90</p>

                <button>Adicionar ao Carrinho</button>
            </div>


            <div class="card-produto">
                <img src="img/moletom.jpg" alt="Moletom Masculino">

                <h3>Moletom</h3>

                <p>R$ 149,90</p>

                <button>Adicionar ao Carrinho</button>
            </div>

        </div>

    </section>

</main>

    <script src="js/script.js"></script>
    </body>
</html>
